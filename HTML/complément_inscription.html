<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <script src="js/script.js" defer></script>
    <title>MNS Football Club</title>
</head>

<body>
    <main>
        <section class="container">
            <h1>Complément informations personnelles</h1>
            <p>Merci de compléter vos informations personnelles afin de valider votre inscription.</p>

            <form action="traitement.php" method="post" id="test-form" class="form">
                <!-- Ceci est un commentaire-->
                <div> * champs obligatoires</div>
                <div class="form-group">
                    <label for="mail">Email *</label>
                    <div>
                        <input type="email" id="mail" name="mail" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="birthday">Date de naissance *</label>
                    <div>
                        <input type="date" id="birthday" name="birthday" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="adress">Adresse *</label>
                    <div>
                        <input type="text" id="adress" name="adress" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="postal">Code postal *</label>
                    <div>
                        <input type="text" id="postal" name="postal" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="city">Ville *</label>
                    <div>
                        <input type="text" id="city" name="city" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="pwd-confirm">Confirmation*</label>
                    <div class="input-with-button">
                        <input type="password" id="pwd-confirm" name="pwd-confirm" required>
                        <button type="button" id="pwd-confirm-show">
                            <i class="bx bx-eye" aria-label="Afficher le mot de passe"></i>
                            <i class="bx bx-eye-slash" aria-label="Masquer le mot de passe"></i>
                        </button>
                    </div>
                </div>
                <input type="submit" value="Valider">
            </form>
        </section>
    </main>
</body>

</html>
