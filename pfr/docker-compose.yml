services:
  # ─── PHP natif (votre projet racine) ───────────────────────────
  php:
    build: .
    container_name: php_82
    ports:
      - 8000:80
    volumes:
      - ./:/var/www/html

  # ─── PHP-FPM pour Symfony ──────────────────────────────────────
  php_symfony:
    image: php:8.2-fpm
    container_name: php_symfony
    volumes:
      - ./mns-symfony:/var/www/symfony
    working_dir: /var/www/symfony
    # Extensions nécessaires pour Symfony + Doctrine MySQL
    command: >
      sh -c "docker-php-ext-install pdo pdo_mysql && php-fpm"
  # ─── Nginx pour Symfony ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_symfony
    ports:
      - "8001:80" # Symfony accessible sur http://localhost:8001
    volumes:
      - ./mns-symfony:/var/www/symfony # Code source
      - ./nginx/symfony.conf:/etc/nginx/conf.d/default.conf # Config Nginx
    depends_on:
      - php_symfony

  # ─── Base de données MySQL ─────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mysql_8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ACA
      MYSQL_USER: zou
      MYSQL_PASSWORD: aca2026
    ports:
      - "3307:3306"
  # ─── phpMyAdmin ────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
